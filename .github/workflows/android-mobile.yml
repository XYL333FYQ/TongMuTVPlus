name: Build Android Mobile APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/android-mobile/**'
      - '.github/workflows/android-mobile.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: '打包并测试通过后，发布到仓库 Releases（客户端下载）'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      apk_name: ${{ steps.collect.outputs.apk_name }}
      build: ${{ steps.stamp.outputs.build }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare app icon from public/icons
        run: |
          mkdir -p apps/android-mobile/app/src/main/res/drawable
          cp public/icons/icon-512x512.png apps/android-mobile/app/src/main/res/drawable/logo.png

      - name: Decode signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_MOBILE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_MOBILE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_MOBILE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_MOBILE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/android-mobile-release.keystore
            echo "build_type=release" >> "$GITHUB_OUTPUT"
            echo "task=Release" >> "$GITHUB_OUTPUT"
          else
            echo "签名 secrets 不全，只能出 debug APK（每次签名都不同，更新要先卸载旧版）"
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
            echo "task=Debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp build time
        id: stamp
        run: |
          now=$(date -u +%s)
          echo "build=$(date -u -d @$now +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          echo "code=$(( (now - 1767225600) / 60 ))" >> "$GITHUB_OUTPUT"
          echo "name=$(date -u -d @$now +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: apps/android-mobile
        env:
          VERSION_NAME: ${{ steps.stamp.outputs.name }}
          VERSION_CODE: ${{ steps.stamp.outputs.code }}
          TM_BUILD: ${{ steps.stamp.outputs.build }}
          ANDROID_KEYSTORE_PATH: /tmp/android-mobile-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_MOBILE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_MOBILE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_MOBILE_KEY_PASSWORD }}
        run: gradle assemble${{ steps.signing.outputs.task }} --stacktrace

      - name: Collect APK
        id: collect
        run: |
          mkdir -p /tmp/apk
          cp "apps/android-mobile/app/build/outputs/apk/${{ steps.signing.outputs.build_type }}/app-${{ steps.signing.outputs.build_type }}.apk" \
            "/tmp/apk/TongMuTV-Plus-Android.apk"
          ls -lh /tmp/apk
          echo "apk_name=TongMuTV-Plus-Android.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tongmutvplus-android-mobile
          path: /tmp/apk/*.apk
          if-no-files-found: error
          retention-days: 90

  smoke:
    name: Emulator smoke test (API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [24, 34]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: tongmutvplus-android-mobile
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash apps/android-mobile/ci/smoke.sh apk/${{ needs.build.outputs.apk_name }} smoke-out

      - name: Upload smoke screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-android-api${{ matrix.api }}
          path: smoke-out
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish to Releases
    needs: [build, smoke]
    # 推送触发时也走发布，但必须经过 release 环境里的人工批准；手动触发看 publish 开关
    if: ${{ github.event_name == 'push' || inputs.publish }}
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: tongmutvplus-android-mobile
          path: release

      - name: Upload to the "clients" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -lh release
          gh release create clients --target "${{ github.sha }}" --latest \
            --title "客户端下载" \
            --notes "Windows 桌面端、安卓手机端、安卓电视端安装包。首次打开填你自己的服务器地址即可。说明见仓库 README。" \
            2>/dev/null || true
          gh release upload clients release/*.apk --clobber
          # 版本清单：客户端据此判断有没有新包（构建时间比自己新就提示更新）
          echo '{"build":"${{ needs.build.outputs.build }}","file":"TongMuTV-Plus-Android.apk"}' > client-android.json
          gh release upload clients client-android.json --clobber
