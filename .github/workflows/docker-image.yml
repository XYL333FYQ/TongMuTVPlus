name: Build & Push Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker 标签（分支构建仅接受 client-audit-*；latest 自动转为提交标签）'
        required: false
        default: 'latest'
        type: string
  # 推送到 main 时构建镜像并发布到 ghcr.io/<你的用户名>/tongmutvplus
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # 先跑完整检查；任何一项失败，镜像都不会打包发布
  checks:
    uses: ./.github/workflows/checks.yml

  tag-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate publication tags before building
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/tongmutvplus
          IMAGE_TAG: ${{ inputs.tag || 'latest' }}
          COMMIT_SHA: ${{ github.sha }}
          IS_DEFAULT_BRANCH: ${{ github.ref_name == github.event.repository.default_branch }}
        run: |
          export IMAGE_REPOSITORY="${IMAGE_REPOSITORY,,}"
          IMAGE_VERSION="$(tr -d '[:space:]' < VERSION.txt)" node scripts/docker-image-tags.cjs

  build:
    needs:
      - checks
      - tag-policy
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}

    steps:
      - name: Prepare platform name
        run: |
          echo "PLATFORM_NAME=${{ matrix.platform }}" | sed 's|/|-|g' >> $GITHUB_ENV

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=v$(tr -d '[:space:]' < VERSION.txt)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        id: lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5

        with:
          images: ghcr.io/${{ steps.lowercase.outputs.owner }}/tongmutvplus
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag || 'latest' }},enable={{is_default_branch}}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            APP_COMMIT_SHA=${{ github.sha }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Architecture images are pushed by digest; only the merged manifest
          # receives tags after both builds pass the publication policy.
          outputs: type=image,name=ghcr.io/${{ steps.lowercase.outputs.owner }}/tongmutvplus,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_NAME }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=v$(tr -d '[:space:]' < VERSION.txt)" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        id: lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ steps.lowercase.outputs.owner }}/tongmutvplus
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
          IMAGE_TAG: ${{ inputs.tag || 'latest' }}
          COMMIT_SHA: ${{ github.sha }}
          IS_DEFAULT_BRANCH: ${{ github.ref_name == github.event.repository.default_branch }}
        run: |
          IMAGE_VERSION="${IMAGE_VERSION#v}"
          export IMAGE_VERSION
          tag_lines=$(node "$GITHUB_WORKSPACE/scripts/docker-image-tags.cjs")
          tag_args=()
          while IFS= read -r tag; do tag_args+=(-t "$tag"); done <<< "$tag_lines"
          docker buildx imagetools create \
            "${tag_args[@]}" \
            $(printf 'ghcr.io/${{ steps.lowercase.outputs.owner }}/tongmutvplus@sha256:%s ' *)

  # Digest-pinned installations may still use untagged older images. A build
  # must not delete those images or the workflow evidence needed for rollback.
  # Retention is a separate inventory-based maintenance operation.
