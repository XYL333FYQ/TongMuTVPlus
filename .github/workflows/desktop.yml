name: Build Windows Desktop

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build ${{ matrix.arch }} installer
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Install Tauri CLI
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund

      - name: Generate app icons from public/icons
        working-directory: apps/desktop
        run: npx tauri icon ../../public/icons/icon-512x512.png

      - name: Build NSIS installer
        working-directory: apps/desktop
        run: npx tauri build --target ${{ matrix.target }} --bundles nsis

      - name: Collect installer
        shell: bash
        run: |
          mkdir -p dist
          cp apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe dist/
          ls -lh dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: tongmutvplus-windows-${{ matrix.arch }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 90

  smoke:
    name: Install and launch smoke test (x64)
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: tongmutvplus-windows-x64
          path: installer

      - name: Install silently, launch, screenshot
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer -Filter *.exe | Select-Object -First 1
          Write-Host "Installer: $($setup.FullName)"
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait

          $dir = Join-Path $env:LOCALAPPDATA 'TongMuTV Plus'
          Get-ChildItem $dir -Recurse -Depth 1 | Select-Object FullName, Length | Format-Table | Out-String | Write-Host
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch 'unins|uninst' } | Select-Object -First 1
          if (-not $exe) { throw "安装后找不到主程序：$dir" }

          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 12

          New-Item -ItemType Directory -Force -Path smoke-out | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save("smoke-out/desktop.png")

          $alive = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $alive) { throw "应用启动后进程已退出" }
          $wv = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count
          Write-Host "PASS: 进程存活，msedgewebview2 进程数 = $wv"
          if ($wv -eq 0) { throw "没有 WebView2 子进程，页面可能没加载" }
          Stop-Process -Id $proc.Id -Force

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-windows
          path: smoke-out
          if-no-files-found: ignore
          retention-days: 14
