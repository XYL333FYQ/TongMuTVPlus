name: Build Windows Desktop

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '打包并测试通过后，发布到仓库 Releases（客户端下载）'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build ${{ matrix.arch }} (installer + portable)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Install Tauri CLI
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund

      - name: Generate app icons from public/icons
        working-directory: apps/desktop
        run: npx tauri icon ../../public/icons/icon-512x512.png

      - name: Build NSIS installer
        working-directory: apps/desktop
        run: npx tauri build --target ${{ matrix.target }} --bundles nsis

      - name: Collect installer and portable zip
        shell: bash
        run: |
          T=apps/desktop/src-tauri/target/${{ matrix.target }}/release
          mkdir -p dist stage
          cp "$T"/bundle/nsis/*.exe "dist/TongMuTV-Plus-Windows-${{ matrix.arch }}-Setup.exe"
          # 便携版：就是安装包里那个主程序 exe，加一份说明
          EXE=$(ls "$T"/*.exe | head -n 1)
          cp "$EXE" "stage/TongMuTV Plus.exe"
          printf '%s\r\n' \
            "TongMuTV Plus 便携版" \
            "" \
            "双击「TongMuTV Plus.exe」即可，不用安装。" \
            "首次打开填写你的服务器地址；Ctrl+Shift+S 更换地址，F11 全屏。" \
            "" \
            "需要系统自带 WebView2 运行时（Windows 11 和多数 Windows 10 已自带）。" \
            "打不开的话先安装：https://developer.microsoft.com/microsoft-edge/webview2/" \
            "登录状态和服务器地址保存在 %LOCALAPPDATA%\com.tongmutvplus.desktop 里。" \
            > "stage/使用说明.txt"
          pwsh -Command "Compress-Archive -Path 'stage/*' -DestinationPath 'dist/TongMuTV-Plus-Windows-${{ matrix.arch }}-Portable.zip'"
          ls -lh dist

      - name: Upload installer and portable zip
        uses: actions/upload-artifact@v4
        with:
          name: tongmutvplus-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  smoke:
    name: Install and launch smoke test (x64)
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: tongmutvplus-windows-x64
          path: installer

      - name: Install silently, launch, screenshot
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer -Filter *Setup.exe | Select-Object -First 1
          Write-Host "Installer: $($setup.FullName)"
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait

          $dir = Join-Path $env:LOCALAPPDATA 'TongMuTV Plus'
          Get-ChildItem $dir -Recurse -Depth 1 | Select-Object FullName, Length | Format-Table | Out-String | Write-Host
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch 'unins|uninst' } | Select-Object -First 1
          if (-not $exe) { throw "安装后找不到主程序：$dir" }

          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 12

          New-Item -ItemType Directory -Force -Path smoke-out | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save("smoke-out/desktop.png")

          $alive = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $alive) { throw "应用启动后进程已退出" }
          $wv = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count
          Write-Host "PASS: 进程存活，msedgewebview2 进程数 = $wv"
          if ($wv -eq 0) { throw "没有 WebView2 子进程，页面可能没加载" }
          Stop-Process -Id $proc.Id -Force

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-windows
          path: smoke-out
          if-no-files-found: ignore
          retention-days: 14

  portable-smoke:
    name: Portable zip smoke test (x64)
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: tongmutvplus-windows-x64
          path: dl

      - name: Unzip, launch the portable exe without installing
        shell: pwsh
        run: |
          Expand-Archive dl/TongMuTV-Plus-Windows-x64-Portable.zip -DestinationPath portable
          Get-ChildItem portable | Format-Table Name, Length | Out-String | Write-Host
          $proc = Start-Process -FilePath "portable/TongMuTV Plus.exe" -PassThru
          Start-Sleep -Seconds 12
          $alive = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $alive) { throw "便携版启动后进程已退出" }
          $wv = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count
          Write-Host "PASS: 便携版进程存活，msedgewebview2 进程数 = $wv"
          if ($wv -eq 0) { throw "没有 WebView2 子进程" }
          Stop-Process -Id $proc.Id -Force

  release:
    name: Publish to Releases
    needs: [build, smoke, portable-smoke]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all Windows packages
        uses: actions/download-artifact@v4
        with:
          pattern: tongmutvplus-windows-*
          merge-multiple: true
          path: release

      - name: Upload to the "clients" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -lh release
          gh release create clients --target "${{ github.sha }}" --latest \
            --title "客户端下载" \
            --notes "Windows 桌面端、安卓手机端、安卓电视端安装包。首次打开填你自己的服务器地址即可。说明见仓库 README。" \
            2>/dev/null || true
          gh release upload clients release/* --clobber
