name: Build Android TV APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/android-tv/**'
      - '.github/workflows/android-tv.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: '可选：默认服务器地址（不用带 /tv）。留空则首次打开时在电视上填写'
        required: false
        default: ''
        type: string
      app_name:
        description: 'Android TV 应用名称'
        required: true
        default: 'TongMuTV Plus'
        type: string
      version_name:
        description: '版本名'
        required: false
        default: '1.0.0'
        type: string
      version_code:
        description: '版本号，必须是整数'
        required: false
        default: '1'
        type: string
      publish:
        description: '打包并测试通过后，发布到仓库 Releases（客户端下载）'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build Android TV APK (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard-webview
            flavor: webview
            flavor_task: Webview
            min_sdk: '23'
            label: webview-android6plus
          - variant: compat-webview
            flavor: webview
            flavor_task: Webview
            min_sdk: '21'
            label: webview-android5plus
          - variant: standard-gecko
            flavor: gecko
            flavor_task: Gecko
            min_sdk: '23'
            label: geckoview-android6plus
          - variant: compat-gecko
            flavor: gecko
            flavor_task: Gecko
            min_sdk: '21'
            label: geckoview-android5plus

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 默认会装已下架的 'tools' 包，导致 sdkmanager 报 "Failed to find package 'tools'"
          # 这里只装 platform-tools，去掉过时的 tools
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare Android TV icon from public/logo.png
        run: |
          cp public/logo.png apps/android-tv/app/src/main/res/drawable/logo.png

      - name: Decode Android signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_MOBILE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_MOBILE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_MOBILE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_MOBILE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/android-tv-release.keystore
            echo "build_type=release" >> "$GITHUB_OUTPUT"
            echo "build_type_task=Release" >> "$GITHUB_OUTPUT"
            echo "apk_suffix=release" >> "$GITHUB_OUTPUT"
          else
            echo "签名 secrets 不全，只能出 debug APK（每次签名都不同，更新要先卸载旧版）"
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
            echo "build_type_task=Debug" >> "$GITHUB_OUTPUT"
            echo "apk_suffix=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: apps/android-tv
        env:
          BASE_URL: ${{ inputs.base_url }}
          APP_NAME: ${{ inputs.app_name || 'TongMuTV Plus' }}
          VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
          VERSION_CODE: ${{ inputs.version_code || '1' }}
          MIN_SDK: ${{ matrix.min_sdk }}
          ANDROID_KEYSTORE_PATH: /tmp/android-tv-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_MOBILE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_MOBILE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_MOBILE_KEY_PASSWORD }}
        run: |
          gradle assemble${{ matrix.flavor_task }}${{ steps.signing.outputs.build_type_task }} \
            -PBASE_URL="$BASE_URL" \
            -PAPP_NAME="$APP_NAME" \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE" \
            -PMIN_SDK="$MIN_SDK"

      - name: Collect APK artifacts
        run: |
          mkdir -p /tmp/android-tv-apks
          cp \
            "apps/android-tv/app/build/outputs/apk/${{ matrix.flavor }}/${{ steps.signing.outputs.build_type }}/app-${{ matrix.flavor }}-${{ steps.signing.outputs.apk_suffix }}.apk" \
            "/tmp/android-tv-apks/TongMuTV-Plus-TV-${{ matrix.label }}.apk"
          ls -lh /tmp/android-tv-apks

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tongmutvplus-android-tv-${{ matrix.label }}
          path: /tmp/android-tv-apks/*.apk
          if-no-files-found: error
          retention-days: 90

  smoke:
    name: Emulator smoke test (webview, API 34)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: tongmutvplus-android-tv-webview-android6plus
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash apps/android-mobile/ci/smoke.sh apk/TongMuTV-Plus-TV-webview-android6plus.apk smoke-out com.tongmutvplus.tv

      - name: Upload smoke screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-android-tv
          path: smoke-out
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish to Releases
    needs: [build, smoke]
    # 推送触发时也走发布，但必须经过 release 环境里的人工批准；手动触发看 publish 开关
    if: ${{ github.event_name == 'push' || inputs.publish }}
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all TV APKs
        uses: actions/download-artifact@v4
        with:
          pattern: tongmutvplus-android-tv-*
          merge-multiple: true
          path: release

      - name: Upload to the "clients" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -lh release
          gh release create clients --target "${{ github.sha }}" --latest \
            --title "客户端下载" \
            --notes "Windows 桌面端、安卓手机端、安卓电视端安装包。首次打开填你自己的服务器地址即可。说明见仓库 README。" \
            2>/dev/null || true
          gh release upload clients release/*webview*.apk --clobber
