<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>一起看：选房间（手机）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:{{c.scrim}};color:{{c.fg}};font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.5">
<div style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:8px 16px 36px;border-radius:28px 28px 0 0;background:{{c.panel}};border:1px solid {{c.line}};box-shadow:0 -20px 60px rgba(0,0,0,0.5)">
<div style="margin:0 auto;width:36px;height:5px;border-radius:3px;background:{{c.line}}"></div>
<div style="margin-top:20px;display:flex;align-items:center;justify-content:space-between"><div><div style="font-size:12px;color:{{c.sub}}">一起看</div><div style="font-size:22px;font-weight:700;letter-spacing:-0.01em">潜伏6</div></div><button aria-label="关闭" style="width:44px;height:44px;border-radius:50%;border:0;background:{{c.soft}};color:{{c.fg}};cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<div style="margin-top:16px;font-size:13px;color:{{c.sub}}">加入哪个房间的片单？</div>
<div style="margin-top:8px">
<sc-for list="{{rooms}}" as="r" hint-placeholder-count="2"><div style="display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 0;border-bottom:1px solid {{r.line}}"><div style="flex:none;width:64px;height:36px;border-radius:6px;background:{{r.bg}}"></div><div style="flex:1;min-width:0"><div style="font-weight:500">{{r.name}}</div><div style="font-size:12px;color:{{r.sub}}">{{r.note}}</div></div><button style="flex:none;height:44px;padding:0 16px;border-radius:10px;border:1px solid {{r.line}};background:transparent;color:{{r.fg}};font:inherit;font-weight:500;cursor:pointer">加入片单</button></div></sc-for>
</div>
<button style="margin-top:16px;width:100%;height:52px;border-radius:12px;border:1px dashed {{c.sub}};background:transparent;color:{{c.fg}};font:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新建房间并加入片单</button>
<div style="margin-top:12px;font-size:12px;color:{{c.sub}};text-align:center">加入片单不会打断房间正在播放的影片</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const d = this.props.dark !== false;
const c = d ? { scrim: '#050505', panel: '#141414', fg: '#fafafa', fg2: 'rgba(250,250,250,0.4)', sub: '#a3a3a3', line: '#262626', soft: '#1a1a1a', poster: '#1c1c1c', raised: '#262626', btnBg: '#fafafa', btnFg: '#0a0a0a', glass: 'rgba(28,28,28,0.9)' } : { scrim: '#b8b8b8', panel: '#ffffff', fg: '#0a0a0a', fg2: 'rgba(10,10,10,0.4)', sub: '#6b6b6b', line: '#e5e5e5', soft: '#f5f5f5', poster: '#ececec', raised: '#e0e0e0', btnBg: '#0a0a0a', btnFg: '#ffffff', glass: 'rgba(255,255,255,0.9)' };
const rooms = [['周五电影夜', '3 人在线 · 正在播放 峡湾'], ['周末追剧', '无人在线 · 片单 2 部待播']];
return { c, rooms: rooms.map((r) => ({ name: r[0], note: r[1], bg: c.raised, line: c.line, sub: c.sub, fg: c.fg })) };
}
}
</script>
</body>
</html>
