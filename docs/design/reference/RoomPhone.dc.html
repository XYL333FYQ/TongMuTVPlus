<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>房间页（手机）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>body{margin:0}a{color:inherit;text-decoration:none}</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:{{c.bg}};color:{{c.fg}};font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.5">
<div style="padding:56px 16px 0;display:flex;align-items:flex-end;justify-content:space-between">
<div><div style="display:flex;align-items:center;gap:6px;font-size:12px;color:{{c.sub}}"><span style="width:6px;height:6px;border-radius:50%;background:{{c.fg}}"></span>已连接 · 3 人在线</div><h1 style="margin:4px 0 0;font-size:30px;line-height:1.2;font-weight:700;letter-spacing:-0.02em">周五电影夜</h1></div>
<div style="width:36px;height:36px;box-sizing:border-box;border:1px solid {{c.line}};border-radius:50%;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-label="邀请朋友"><path d="M12 5v14M5 12h14"/></svg></div>
</div>
<div style="margin:20px 16px 0;position:relative;height:201px;border-radius:16px;background:#000;overflow:hidden;color:#fff">
<div style="position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center"><div style="width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,0.9);color:#0a0a0a;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg></div></div>
<div style="position:absolute;left:14px;right:14px;bottom:12px;display:flex;align-items:center;gap:10px;font-size:11px"><span>01:52</span><div style="flex:1;height:3px;border-radius:2px;background:#404040"><div style="width:94%;height:3px;border-radius:2px;background:#fff"></div></div><span>02:00</span></div>
</div>
<div style="padding:16px 16px 0;display:flex;align-items:center;justify-content:space-between"><div><div style="font-size:18px;font-weight:700">峡湾</div><div style="font-size:12px;color:{{c.sub}}">第 1 集 · 你正在主持</div></div><div style="height:36px;padding:0 16px;box-sizing:border-box;border:1px solid {{c.line}};border-radius:10px;display:flex;align-items:center;font-weight:500;font-size:13px">仅自己看</div></div>
<div style="margin:20px 16px 0;display:flex;gap:2px;padding:3px;border-radius:12px;background:{{c.soft}}">
<sc-for list="{{seg}}" as="t" hint-placeholder-count="3"><div style="flex:1;text-align:center;padding:7px 0;border-radius:9px;background:{{t.bg}};color:{{t.col}};font-weight:{{t.w}};font-size:13px">{{t.label}}</div></sc-for>
</div>
<div style="padding:8px 16px 0">
<sc-for list="{{queue}}" as="q" hint-placeholder-count="3"><div style="display:flex;align-items:center;gap:12px;padding:10px 0"><span style="width:18px;font-size:12px;color:{{q.sub}}">{{q.n}}</span><div style="width:64px;height:36px;border-radius:6px;background:{{q.bg}}"></div><div style="flex:1;min-width:0"><div style="font-weight:500;font-size:14px">{{q.title}}</div><div style="font-size:12px;color:{{q.sub}}">{{q.who}}</div></div></div></sc-for>
</div>
<div style="position:absolute;left:16px;right:16px;bottom:20px;height:64px;box-sizing:border-box;padding:6px;border-radius:24px;background:{{c.glass}};border:1px solid {{c.line}};box-shadow:0 8px 32px rgba(0,0,0,0.3);display:flex;gap:2px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<div style="flex:1;border-radius:18px;background:{{t.bg}};color:{{t.col}};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:{{t.w}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"/></svg>{{t.label}}</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const d = this.props.dark !== false;
const c = d ? { bg: '#0a0a0a', fg: '#fafafa', sub: '#a3a3a3', line: '#262626', soft: '#141414', poster: '#1c1c1c', btnBg: '#fafafa', btnFg: '#0a0a0a', glass: 'rgba(28,28,28,0.82)' } : { bg: '#ffffff', fg: '#0a0a0a', sub: '#6b6b6b', line: '#e5e5e5', soft: '#f5f5f5', poster: '#ececec', btnBg: '#0a0a0a', btnFg: '#ffffff', glass: 'rgba(255,255,255,0.82)' };
const ic = [['发现','M12 3a9 9 0 100 18 9 9 0 000-18zM15.5 8.5l-2 5-5 2 2-5z'],['片库','M5 4v16M10 4v16M15 5l4 14'],['房间','M9 4.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7zM2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6M16 4.5a3.5 3.5 0 010 7M18 14c2 .6 3.5 2.4 3.5 6'],['搜索','M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-4-4'],['我的','M12 4a4 4 0 100 8 4 4 0 000-8zM4 21c0-4 3.5-7 8-7s8 3 8 7']];
const seg = ['片单 3', '聊天 1', '成员 3'];
const q = [['峡湾', 'A 添加'], ['罗斯', 'B 添加'], ['魔方小姐', 'A 添加']];
return {
c,
tabs: ic.map((t, i) => ({ label: t[0], d: t[1], bg: i === 2 ? c.line : 'transparent', col: i === 2 ? c.fg : c.sub, w: i === 2 ? '700' : '500' })),
seg: seg.map((t, i) => ({ label: t, bg: i === 0 ? c.line : 'transparent', col: i === 0 ? c.fg : c.sub, w: i === 0 ? '700' : '500' })),
queue: q.map((r, i) => ({ n: '0' + (i + 1), title: r[0], who: r[1], bg: c.poster, sub: c.sub }))
};
}
}
</script>
</body>
</html>
