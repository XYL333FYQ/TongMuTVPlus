<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>房间页</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>body{margin:0}a{color:inherit;text-decoration:none}</style>
</helmet>
<div style="position:relative;width:1280px;height:860px;overflow:hidden;background:{{c.bg}};color:{{c.fg}};font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.5">
<div style="height:64px;box-sizing:border-box;padding:0 48px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid {{c.line}}">
<div style="display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px"><div style="width:28px;height:28px;border-radius:8px;background:{{c.btnBg}};color:{{c.btnFg}};display:flex;align-items:center;justify-content:center;font-size:12px">TM</div>TongMuTV</div>
<nav style="display:flex;gap:2px;padding:4px;border-radius:999px;background:{{c.soft}};border:1px solid {{c.line}}"><a href="#" style="padding:6px 20px;color:{{c.sub}};font-size:14px">发现</a><a href="#" style="padding:6px 20px;color:{{c.sub}};font-size:14px">片库</a><a href="#" style="padding:6px 20px;border-radius:999px;background:{{c.btnBg}};color:{{c.btnFg}};font-weight:700;font-size:14px">房间</a></nav>
<div style="display:flex;align-items:center;justify-content:flex-end;gap:12px"><div style="width:36px;height:36px;box-sizing:border-box;border:1px solid {{c.line}};border-radius:10px;display:flex;align-items:center;justify-content:center;color:{{c.sub}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-label="搜索"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></div><div style="width:36px;height:36px;border-radius:50%;background:{{c.btnBg}};color:{{c.btnFg}};display:flex;align-items:center;justify-content:center;font-size:13px">A</div></div>
</div>
<div style="padding:40px 48px 0;display:flex;align-items:flex-end;justify-content:space-between">
<div><div style="display:flex;align-items:center;gap:8px;font-size:13px;color:{{c.sub}}"><span style="width:6px;height:6px;border-radius:50%;background:{{c.fg}}"></span>已连接 · 你正在主持</div><h1 style="margin:8px 0 0;font-size:40px;line-height:1.15;font-weight:700;letter-spacing:-0.02em">周五电影夜</h1></div>
<div style="display:flex;align-items:center;gap:12px">
<div style="display:flex"><span style="width:32px;height:32px;border-radius:50%;background:{{c.line}};border:2px solid {{c.bg}};display:flex;align-items:center;justify-content:center;font-size:12px">A</span><span style="width:32px;height:32px;margin-left:-8px;border-radius:50%;background:{{c.line}};border:2px solid {{c.bg}};display:flex;align-items:center;justify-content:center;font-size:12px">B</span><span style="width:32px;height:32px;margin-left:-8px;border-radius:50%;background:{{c.line}};border:2px solid {{c.bg}};display:flex;align-items:center;justify-content:center;font-size:12px">C</span></div>
<span style="color:{{c.sub}};margin-right:8px">3 人</span>
<a href="#" style="height:40px;padding:0 20px;box-sizing:border-box;border:1px solid {{c.line}};border-radius:10px;display:flex;align-items:center;font-weight:500">邀请朋友</a>
<a href="#" style="height:40px;padding:0 20px;box-sizing:border-box;border:1px solid {{c.line}};border-radius:10px;display:flex;align-items:center;font-weight:500;color:{{c.sub}}">退出房间</a>
</div>
</div>
<div style="padding:32px 48px 0;display:grid;grid-template-columns:2fr 1fr;gap:24px">
<div>
<div style="position:relative;aspect-ratio:16/9;border-radius:20px;background:#000;overflow:hidden;color:#fff">
<div style="position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center"><div style="width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,0.9);color:#0a0a0a;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg></div></div>
<div style="position:absolute;left:20px;right:20px;bottom:16px;display:flex;align-items:center;gap:12px;font-size:12px"><span>01:52</span><div style="flex:1;height:4px;border-radius:2px;background:#404040"><div style="width:94%;height:4px;border-radius:2px;background:#fff"></div></div><span>02:00</span></div>
</div>
<div style="margin-top:20px;display:flex;align-items:center;justify-content:space-between"><div><div style="font-size:22px;font-weight:700;letter-spacing:-0.01em">峡湾</div><div style="margin-top:2px;font-size:13px;color:{{c.sub}}">第 1 集 · 原始画质优先</div></div><a href="#" style="height:40px;padding:0 20px;box-sizing:border-box;border:1px solid {{c.line}};border-radius:10px;display:flex;align-items:center;font-weight:500">仅自己看</a></div>
</div>
<div style="box-sizing:border-box;padding:16px;border-radius:20px;background:{{c.soft}};border:1px solid {{c.line}};display:flex;flex-direction:column">
<div style="display:flex;gap:2px;padding:3px;border-radius:12px;background:{{c.bg}}">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><div style="flex:1;text-align:center;padding:6px 0;border-radius:9px;background:{{t.bg}};color:{{t.col}};font-weight:{{t.w}};font-size:13px">{{t.label}}</div></sc-for>
</div>
<div style="margin-top:8px">
<sc-for list="{{queue}}" as="q" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:12px;padding:10px 4px"><span style="width:18px;font-size:12px;color:{{q.sub}}">{{q.n}}</span><div style="width:64px;height:36px;border-radius:6px;background:{{q.bg}}"></div><div style="flex:1;min-width:0"><div style="font-weight:500;font-size:14px">{{q.title}}</div><div style="font-size:12px;color:{{q.sub}}">{{q.who}}</div></div></div>
</sc-for>
</div>
<div style="flex:1"></div>
<a href="#" style="height:40px;border:1px solid {{c.line}};border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:500">添加影片</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
renderVals() {
const d = this.props.dark !== false;
const c = d ? { bg: '#0a0a0a', fg: '#fafafa', sub: '#a3a3a3', line: '#262626', soft: '#141414', poster: '#1c1c1c', btnBg: '#fafafa', btnFg: '#0a0a0a', glass: 'rgba(28,28,28,0.82)' } : { bg: '#ffffff', fg: '#0a0a0a', sub: '#6b6b6b', line: '#e5e5e5', soft: '#f5f5f5', poster: '#ececec', btnBg: '#0a0a0a', btnFg: '#ffffff', glass: 'rgba(255,255,255,0.82)' };
const tabs = ['片单 3', '聊天 1', '成员 3'];
const q = [['峡湾', 'A 添加'], ['罗斯', 'B 添加'], ['魔方小姐', 'A 添加']];
return {
c,
tabs: tabs.map((t, i) => ({ label: t, bg: i === 0 ? c.line : 'transparent', col: i === 0 ? c.fg : c.sub, w: i === 0 ? '700' : '500' })),
queue: q.map((r, i) => ({ n: '0' + (i + 1), title: r[0], who: r[1], bg: c.poster, sub: c.sub }))
};
}
}
</script>
</body>
</html>
