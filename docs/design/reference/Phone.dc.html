<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>首页（手机）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>body{margin:0}a{color:inherit;text-decoration:none}</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:{{c.bg}};color:{{c.fg}};font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.5">
<div style="padding:56px 16px 0;display:flex;align-items:center;justify-content:space-between"><h1 style="margin:0;font-size:34px;line-height:1.2;font-weight:700;letter-spacing:-0.02em">发现</h1><div style="width:36px;height:36px;border-radius:50%;background:{{c.btnBg}};color:{{c.btnFg}};display:flex;align-items:center;justify-content:center;font-size:13px">A</div></div>
<div style="margin:16px 16px 0;position:relative;height:340px;border-radius:24px;background:{{c.soft}};border:1px solid {{c.line}};overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;box-sizing:border-box">
<div style="position:absolute;top:16px;left:0;right:0;text-align:center;color:#6b6b6b;font-size:12px">竖版海报或剧照</div>
<div style="color:#a3a3a3;font-size:12px">★ 7.2 · 2026 · 剧情 · 动画</div>
<div style="margin-top:4px;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-0.02em">巴黎绽放的星辰</div>
<div style="margin-top:16px;display:flex;gap:10px"><a href="#" style="flex:1;height:44px;border-radius:12px;background:#fff;color:#0a0a0a;font-weight:700;display:flex;align-items:center;justify-content:center">播放</a><a href="#" style="flex:1;height:44px;box-sizing:border-box;border-radius:12px;border:1px solid #fff;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center">一起看</a></div>
</div>
<div style="padding:24px 0 0 16px"><div style="font-size:20px;font-weight:700">继续观看</div>
<div style="margin-top:12px;display:flex;gap:12px;overflow:hidden">
<sc-for list="{{resume}}" as="r" hint-placeholder-count="3"><div style="flex:none;width:200px"><div style="height:112px;border-radius:12px;background:{{r.bg}};position:relative;overflow:hidden"><div style="position:absolute;left:0;right:0;bottom:0;height:4px;background:{{r.line}}"><div style="width:{{r.pct}};height:4px;background:{{r.fg}}"></div></div></div><div style="margin-top:8px;font-weight:500;font-size:13px">{{r.title}}</div><div style="font-size:12px;color:{{r.sub}}">{{r.note}}</div></div></sc-for>
</div></div>
<div style="position:absolute;left:16px;right:16px;bottom:96px;height:56px;box-sizing:border-box;padding:0 8px 0 10px;border-radius:16px;background:{{c.glass}};border:1px solid {{c.line}};box-shadow:0 8px 24px rgba(0,0,0,0.3);display:flex;align-items:center;gap:10px">
<div style="width:56px;height:34px;border-radius:6px;background:{{c.poster}}"></div>
<div style="flex:1;min-width:0"><div style="font-weight:500;font-size:13px">峡湾</div><div style="font-size:11px;color:{{c.sub}}">周五电影夜 · 一起看</div></div>
<div style="position:relative;width:32px;height:32px;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-label="房间消息，1 条未读"><path d="M21 12a8 8 0 01-11.5 7.2L4 20l1-4.6A8 8 0 1121 12z"/></svg><span style="position:absolute;top:0;right:0;min-width:14px;height:14px;border-radius:7px;background:{{c.btnBg}};color:{{c.btnFg}};font-size:10px;font-weight:700;line-height:14px;text-align:center">1</span></div>
<div style="width:32px;height:32px;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-label="展开"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></div>
</div>
<div style="position:absolute;left:16px;right:16px;bottom:20px;height:64px;box-sizing:border-box;padding:6px;border-radius:24px;background:{{c.glass}};border:1px solid {{c.line}};box-shadow:0 8px 32px rgba(0,0,0,0.3);display:flex;gap:2px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<div style="flex:1;border-radius:18px;background:{{t.bg}};color:{{t.col}};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:{{t.w}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"/></svg>{{t.label}}</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const d = this.props.dark !== false;
const c = d ? { bg: '#0a0a0a', fg: '#fafafa', sub: '#a3a3a3', line: '#262626', soft: '#141414', poster: '#1c1c1c', btnBg: '#fafafa', btnFg: '#0a0a0a', glass: 'rgba(28,28,28,0.82)' } : { bg: '#ffffff', fg: '#0a0a0a', sub: '#6b6b6b', line: '#e5e5e5', soft: '#f5f5f5', poster: '#ececec', btnBg: '#0a0a0a', btnFg: '#ffffff', glass: 'rgba(255,255,255,0.82)' };
const ic = [['发现','M12 3a9 9 0 100 18 9 9 0 000-18zM15.5 8.5l-2 5-5 2 2-5z'],['片库','M5 4v16M10 4v16M15 5l4 14'],['房间','M9 4.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7zM2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6M16 4.5a3.5 3.5 0 010 7M18 14c2 .6 3.5 2.4 3.5 6'],['搜索','M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-4-4'],['我的','M12 4a4 4 0 100 8 4 4 0 000-8zM4 21c0-4 3.5-7 8-7s8 3 8 7']];
const resume = [['峡湾', '看到 45%', '45%'], ['罗斯', '看到 12%', '12%'], ['魔方小姐', '看到 70%', '70%']];
return {
c,
tabs: ic.map((t, i) => ({ label: t[0], d: t[1], bg: i === 0 ? c.line : 'transparent', col: i === 0 ? c.fg : c.sub, w: i === 0 ? '700' : '500' })),
resume: resume.map((r) => ({ title: r[0], note: r[1], pct: r[2], bg: c.poster, line: c.line, fg: c.fg, sub: c.sub }))
};
}
}
</script>
</body>
</html>
