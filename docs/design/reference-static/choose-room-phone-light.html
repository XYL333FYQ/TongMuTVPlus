<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#b8b8b8;color:#0a0a0a;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.5">
<div style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:8px 16px 36px;border-radius:28px 28px 0 0;background:#ffffff;border:1px solid #e5e5e5;box-shadow:0 -20px 60px rgba(0,0,0,0.5)">
<div style="margin:0 auto;width:36px;height:5px;border-radius:3px;background:#e5e5e5"></div>
<div style="margin-top:20px;display:flex;align-items:center;justify-content:space-between"><div><div style="font-size:12px;color:#6b6b6b">一起看</div><div style="font-size:22px;font-weight:700;letter-spacing:-0.01em">潜伏6</div></div><button aria-label="关闭" style="width:44px;height:44px;border-radius:50%;border:0;background:#f5f5f5;color:#0a0a0a;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

<div style="margin-top:8px">
<div style="display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 0;border-bottom:1px solid #e5e5e5"><div style="flex:none;width:64px;height:36px;border-radius:6px;background:#e0e0e0"></div><div style="flex:1;min-width:0"><div style="font-weight:500">周五电影夜</div><div style="font-size:12px;color:#6b6b6b">3 人在线 · 正在播放 峡湾</div></div><button style="flex:none;height:44px;padding:0 16px;border-radius:10px;border:1px solid #e5e5e5;background:transparent;color:#0a0a0a;font:inherit;font-weight:500;cursor:pointer">加入片单</button></div><div style="display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 0;border-bottom:1px solid #e5e5e5"><div style="flex:none;width:64px;height:36px;border-radius:6px;background:#e0e0e0"></div><div style="flex:1;min-width:0"><div style="font-weight:500">周末追剧</div><div style="font-size:12px;color:#6b6b6b">无人在线 · 片单 2 部待播</div></div><button style="flex:none;height:44px;padding:0 16px;border-radius:10px;border:1px solid #e5e5e5;background:transparent;color:#0a0a0a;font:inherit;font-weight:500;cursor:pointer">加入片单</button></div>
