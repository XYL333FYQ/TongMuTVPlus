services:
  tongmutvplus:
    build:
      context: .
      dockerfile: Dockerfile
    # 默认在本机构建；设置 TONGMU_IMAGE=ghcr.io/<用户名>/tongmutvplus:latest 可直接拉取 GitHub 构建好的镜像
    image: '${TONGMU_IMAGE:-tongmutvplus:local}'
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      NEXT_PUBLIC_STORAGE_TYPE: d1
      NEXT_PUBLIC_SITE_NAME: TongMuTV Plus
      SQLITE_DB_PATH: /app/.data/moontv.db
      OFFLINE_DOWNLOAD_DIR: /data
      USERNAME: '${USERNAME:-admin}'
      PASSWORD: '${PASSWORD:?Set a private PASSWORD in .env before starting}'
      APP_COMMIT_SHA: '${APP_COMMIT_SHA:-unversioned}'
      # 留空时首次启动自动生成并保存到 .data/auth-secret
      AUTH_SECRET: '${AUTH_SECRET:-}'
      CRON_PASSWORD: '${CRON_PASSWORD:-}'
      ALLOW_PRIVATE_PROXY_TARGETS: '${ALLOW_PRIVATE_PROXY_TARGETS:-false}'
      TOGETHER_BACKEND: '${TOGETHER_BACKEND:-legacy}'
      SYNCTV_INTERNAL_URL: http://synctv:8080
      TOGETHER_DATA_DIRECTORY: /app/.data
      WATCH_ROOM_ENABLED: 'true'
      WATCH_ROOM_SERVER_TYPE: internal
      ROOM_ALLOWED_ORIGINS: '${ROOM_ALLOWED_ORIGINS:-}'
      CLIENT_DOWNLOAD_BASE_URL: '${CLIENT_DOWNLOAD_BASE_URL:-}'
      ROOM_MAX_OWNED: '${ROOM_MAX_OWNED:-3}'
      ROOM_MAX_MEMBERS: '${ROOM_MAX_MEMBERS:-8}'
      ROOM_MAX_QUEUE: '${ROOM_MAX_QUEUE:-200}'
      ROOM_RECONNECT_GRACE_MS: '${ROOM_RECONNECT_GRACE_MS:-30000}'
      ROOM_OWNER_READY_MS: '${ROOM_OWNER_READY_MS:-5000}'
      ROOM_LEASE_MS: '${ROOM_LEASE_MS:-90000}'
      ROOM_EMPTY_PAUSE_MS: '${ROOM_EMPTY_PAUSE_MS:-60000}'
      ROOM_SLEEP_MS: '${ROOM_SLEEP_MS:-600000}'
      ROOM_ARCHIVE_MS: '${ROOM_ARCHIVE_MS:-2592000000}'
      ROOM_PURGE_MS: '${ROOM_PURGE_MS:-604800000}'
      ROOM_CHAT_RETENTION_MS: '${ROOM_CHAT_RETENTION_MS:-2592000000}'
      PROXY_M3U8_TOKEN: '${PROXY_M3U8_TOKEN:-}'
      TVBOX_SUBSCRIBE_TOKEN: '${TVBOX_SUBSCRIBE_TOKEN:-}'
      # Legacy server-side fallback for existing external players; never read in client code.
      NEXT_PUBLIC_PROXY_M3U8_TOKEN: '${NEXT_PUBLIC_PROXY_M3U8_TOKEN:-}'
      PUID: '${PUID:-1001}'
      PGID: '${PGID:-1001}'
    volumes:
      - ./.data:/app/.data
      - ./data:/data
      - ./backups:/backups
    env_file:
      - path: ./.data/synctv-bridge.env
        required: false
    networks: [default, together_api]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('node:http').get('http://127.0.0.1:3000/health/ready',r=>{r.resume();process.exitCode=r.statusCode===200?0:1}).on('error',()=>process.exitCode=1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Optional isolated rebuild services. No upstream or database host ports.
  synctv:
    profiles: ['together']
    image: synctvorg/synctv:v1.0.14@sha256:0f58fb9b5c91571ab4e3048679b12b4b69f68269ca4e62c3cacfaa83c5cc4934
    restart: unless-stopped
    env_file:
      - path: ./.data/synctv.env
        required: true
    environment:
      SYNCTV_DATA_DIR: /data
      SYNCTV_REDIS_URL: ''
      # Private authenticated bridge traffic shares one upstream IP; retain bounded limiting.
      SYNCTV_REQUEST_RATE_LIMITS_AUTH_MAX_REQUESTS: '${SYNCTV_BRIDGE_AUTH_MAX_REQUESTS:-120}'
      SYNCTV_SERVER_HOST: 0.0.0.0
      SYNCTV_SERVER_PORT: '8080'
      SYNCTV_HEALTH_HOST: 0.0.0.0
      SYNCTV_HEALTH_PORT: '8081'
      SYNCTV_SERVER_ACCESS_LOG_ENABLED: 'false'
      SYNCTV_BOOTSTRAP_CREATE_ROOT_USER: 'true'
      SYNCTV_BOOTSTRAP_ROOT_USERNAME: tongmu_bridge_admin
      SYNCTV_BOOTSTRAP_ROOT_PASSWORD_FILE: /run/secrets/synctv-root-password
      SYNCTV_MANAGEMENT_ENABLED: 'true'
      SYNCTV_MANAGEMENT_TRANSPORT: unix
      SYNCTV_WEBRTC_ENABLE_BUILTIN_STUN: 'false'
    secrets:
      - synctv-root-password
    volumes:
      - synctv_data:/data
      - synctv_uploads:/data/uploads
    depends_on:
      synctv-postgres:
        condition: service_healthy
    networks: [together_api, together_db]
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:8081/health/ready']
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 3

  synctv-postgres:
    profiles: ['together']
    image: postgres:18.6-alpine3.24@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    restart: unless-stopped
    env_file:
      - path: ./.data/synctv-postgres.env
        required: true
    volumes:
      - synctv_postgres:/var/lib/postgresql
    networks: [together_db]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U synctv -d synctv']
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  synctv_data:
  synctv_uploads:
  synctv_postgres:

networks:
  default:
  together_api:
  together_db:
    internal: true

secrets:
  synctv-root-password:
    file: ./.data/synctv-root-password
