[package]
name = "tongmutvplus-desktop"
version = "1.0.0"
description = "TongMuTV Plus desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable：一个窗口里放两块页面（上面本地标题条、下面网站），Tauri 2 里这个功能还挂在这个开关后面
tauri = { version = "2", features = ["unstable"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
