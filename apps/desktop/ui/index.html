<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TongMuTV Plus</title>
    <style>
      :root {
        color-scheme: dark;
        --tm-text: #f2f2f3;
        --tm-muted: #a3a3ac;
        --tm-line: rgba(255, 255, 255, 0.09);
        --tm-line-strong: rgba(255, 255, 255, 0.18);
        --tm-spot: rgba(255, 255, 255, 0.07);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #000;
        color: #f2f2f2;
        font-family: 'Microsoft YaHei UI', 'Segoe UI', system-ui, sans-serif;
      }
      main {
        width: min(440px, 90vw);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 600;
      }
      p {
        margin: 0 0 20px;
        color: #9a9a9a;
        font-size: 14px;
        line-height: 1.6;
      }
      input {
        width: 100%;
        height: 44px;
        padding: 0 14px;
        border: 1px solid #3a3a3a;
        border-radius: 10px;
        background: #111;
        color: inherit;
        font-size: 15px;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid #f2f2f2;
        outline-offset: 2px;
      }
      button {
        margin-top: 12px;
        width: 100%;
        height: 44px;
        border: 0;
        border-radius: 10px;
        background: #f2f2f2;
        color: #000;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      #msg {
        min-height: 22px;
        margin-top: 12px;
        font-size: 13px;
        color: #ff6b6b;
      }
      #status {
        text-align: center;
        color: var(--tm-muted);
      }
      body:has(#status:not([hidden])) {
        background-image: radial-gradient(
          ellipse at center,
          var(--tm-spot),
          transparent 67%
        );
      }
      .launch-aperture {
        position: relative;
        display: block;
        margin: 0 auto 18px;
        width: 156px;
        height: 86px;
        animation: tm-launch-open 460ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .launch-aperture::before,
      .launch-aperture::after {
        position: absolute;
        content: '';
        inset: 9px 20px;
        border: 1px solid var(--tm-line-strong);
        border-radius: 50%;
        transform: rotate(-18deg);
      }
      .launch-aperture::after {
        inset: 16px 27px;
        border-color: var(--tm-line);
        transform: rotate(18deg);
      }
      .launch-beam {
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--tm-text),
          transparent
        );
        animation: tm-launch-sweep 490ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .launch-wordmark {
        display: block;
        margin-bottom: 8px;
        color: var(--tm-text);
        font-size: 24px;
        letter-spacing: -0.035em;
        animation: tm-launch-type 370ms 70ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .launch-wordmark small {
        color: var(--tm-muted);
        font-size: 0.68em;
        letter-spacing: 0.05em;
      }
      @keyframes tm-launch-open {
        from {
          opacity: 0;
          transform: scale(0.68) rotate(-12deg);
        }
      }
      @keyframes tm-launch-sweep {
        0% {
          opacity: 0;
          transform: translateX(-24%) scaleX(0.3);
        }
        46% {
          opacity: 1;
        }
        100% {
          opacity: 0.6;
          transform: translateX(0) scaleX(1);
        }
      }
      @keyframes tm-launch-type {
        from {
          opacity: 0;
          transform: translateY(7px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .launch-aperture,
        .launch-beam,
        .launch-wordmark {
          animation: none;
        }
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main id="status" hidden>
      <span class="launch-aperture" aria-hidden="true"
        ><span class="launch-beam"></span
      ></span>
      <strong class="launch-wordmark">TongMuTV <small>Plus</small></strong>
      <p id="statusText">正在连接…</p>
    </main>
    <main id="form" hidden>
      <h1>连接到你的服务器</h1>
      <p>
        填写 TongMuTV Plus 的访问地址，例如
        <code>https://tv.example.com</code> 或
        <code>192.168.1.10:3000</code>。以后可按 Ctrl+Shift+S 更换。
      </p>
      <input
        id="addr"
        type="text"
        inputmode="url"
        autocomplete="off"
        spellcheck="false"
        placeholder="服务器地址"
      />
      <button id="go" type="button">连接</button>
      <div id="msg" role="alert"></div>
    </main>
    <script>
      var KEY = 'tm_server_url';
      var $ = function (id) {
        return document.getElementById(id);
      };

      // 规范化：补协议、去末尾斜杠。IP / localhost / 带端口默认 http，其余默认 https
      function normalize(raw) {
        var s = (raw || '').trim();
        if (!s) return null;
        if (!/^https?:\/\//i.test(s)) {
          var local =
            /^(localhost|\d{1,3}(\.\d{1,3}){3})(:\d+)?(\/.*)?$/i.test(s) ||
            /^[^/]+:\d+(\/.*)?$/.test(s);
          s = (local ? 'http://' : 'https://') + s;
        }
        s = s.replace(/\/+$/, '');
        try {
          return new URL(s).host ? s : null;
        } catch (e) {
          return null;
        }
      }

      function showForm(message) {
        $('status').hidden = true;
        $('form').hidden = false;
        $('msg').textContent = message || '';
        var saved = localStorage.getItem(KEY);
        if (saved && !$('addr').value) $('addr').value = saved;
        $('addr').focus();
      }

      // 先探测服务器通不通，通了再跳转；不通就留在这里让用户改地址
      function connect(url) {
        $('form').hidden = true;
        $('status').hidden = false;
        $('statusText').textContent = '正在连接 ' + url + ' …';
        var ctrl = new AbortController();
        var timer = setTimeout(function () {
          ctrl.abort();
        }, 8000);
        fetch(url, { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal })
          .then(function () {
            clearTimeout(timer);
            localStorage.setItem(KEY, url);
            location.replace(url);
          })
          .catch(function () {
            clearTimeout(timer);
            showForm('连不上 ' + url + '，请检查地址或网络后重试');
          });
      }

      function submit() {
        var url = normalize($('addr').value);
        if (!url) {
          $('msg').textContent = '地址格式不对';
          return;
        }
        connect(url);
      }

      $('go').addEventListener('click', submit);
      $('addr').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') submit();
      });

      var change = /[?&]change=1/.test(location.search);
      var saved = localStorage.getItem(KEY);
      if (saved && !change) {
        connect(saved);
      } else {
        showForm('');
      }
    </script>
  </body>
</html>
