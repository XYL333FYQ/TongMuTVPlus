<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TongMuTV Plus</title>
    <style>
      /* 标题条：窗口最上面 36px。颜色由页面区报上来（见 inject.js），
         这里的默认值与站点默认的深色主题一致，页面还没报色时先用它。 */
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0b0d;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
        font: 12px/1 'Segoe UI Variable Text', 'Microsoft YaHei UI', 'Segoe UI',
          system-ui, sans-serif;
      }
      #bar {
        position: relative;
        height: 100%;
        overflow: hidden;
      }
      /* 每一层是一套完整的标题条；切主题时新旧两层叠在一起，用 clip-path 做圆形扩散 */
      .layer {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: stretch;
        justify-content: space-between;
        background: var(--bg);
        color: var(--fg);
        box-shadow: inset 0 -1px 0 var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        padding-left: 12px;
      }
      .logo {
        flex: none;
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        border-radius: 6px;
        background: var(--fg);
        color: var(--bg);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 500;
      }
      .ctls {
        display: flex;
        height: 100%;
      }
      .ctl {
        display: grid;
        place-items: center;
        width: 46px;
        height: 100%;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        cursor: default;
      }
      .ctl:hover {
        background: color-mix(in srgb, var(--fg) 10%, transparent);
      }
      .ctl:active {
        background: color-mix(in srgb, var(--fg) 16%, transparent);
      }
      .ctl:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: -4px;
      }
      /* 关闭键悬停变危险红，数值与站点 --tm-danger 相同 */
      .ctl[data-act='close']:hover,
      .ctl[data-act='close']:active {
        background: #e5484d;
        color: #fff;
      }
      .ctl svg {
        width: 10px;
        height: 10px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1;
        pointer-events: none;
      }
      .ic-restore {
        display: none;
      }
      #bar[data-max='true'] .ic-restore {
        display: block;
      }
      #bar[data-max='true'] .ic-max {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="bar" data-max="false"></div>
    <script>
      (function () {
        var bar = document.getElementById('bar');
        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
        var cur = { bg: '#0b0b0d', fg: '#f2f2f3' };
        var curLayer = null;

        // 调用壳里的命令；在普通浏览器里打开这个页面（调试）时没有通道，静默忽略
        function invoke(cmd, args) {
          var t = window.__TAURI_INTERNALS__;
          if (!t || typeof t.invoke !== 'function')
            return Promise.resolve(null);
          return t.invoke(cmd, args).catch(function () {
            return null;
          });
        }

        // 图标用 SVG 线条，不用 emoji
        var BUTTONS =
          '<button type="button" class="ctl" data-act="minimize" aria-label="最小化" title="最小化">' +
          '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5.5h10"/></svg></button>' +
          '<button type="button" class="ctl" data-act="toggle-maximize" aria-label="最大化" title="最大化">' +
          '<svg class="ic-max" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9"/></svg>' +
          '<svg class="ic-restore" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="2.5" width="7" height="7"/><path d="M2.5 2.5v-2h7v7h-2"/></svg></button>' +
          '<button type="button" class="ctl" data-act="close" aria-label="关闭" title="关闭">' +
          '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9"/></svg></button>';

        function makeLayer(t) {
          var el = document.createElement('div');
          el.className = 'layer';
          el.style.setProperty('--bg', t.bg);
          el.style.setProperty('--fg', t.fg);
          el.style.setProperty(
            '--line',
            'color-mix(in srgb, ' + t.fg + ' 10%, transparent)'
          );
          el.innerHTML =
            '<div class="brand"><span class="logo" aria-hidden="true">TM</span>' +
            '<span class="name">TongMuTV Plus</span></div>' +
            '<div class="ctls">' +
            BUTTONS +
            '</div>';
          return el;
        }

        // 收尾：停掉所有动画，只留代表最新主题的那一层
        function settle() {
          bar.getAnimations({ subtree: true }).forEach(function (a) {
            a.cancel();
          });
          Array.prototype.slice.call(bar.children).forEach(function (c) {
            if (c !== curLayer) c.remove();
          });
        }

        // 页面区报来新主题时由壳调用（见 main.rs 的 tm_sync / tm_hello）
        //   kind=circle  与页面同圆心、同半径、同时长、同缓动的圆形扩散
        //   kind=fade    渐变；kind=none 直接换
        window.__tmTheme = function (p) {
          if (!p || !p.bg || !p.fg) return;
          if (cur.bg === p.bg && cur.fg === p.fg) return;
          settle();
          var old = curLayer;
          var next = { bg: p.bg, fg: p.fg };
          var nl = makeLayer(next);
          cur = next;
          curLayer = nl;
          var ms = Number(p.ms) || 0;
          // 消息从页面传到这里要时间：按页面动画真正开始的时刻算出已经走了多久，
          // 从对应的那一帧接着播，延迟再大也和页面对得上；整段时长都过了就直接落到终点
          var elapsed = p.start > 0 ? Math.max(0, Date.now() - p.start) : 0;
          if (
            p.kind === 'none' ||
            reduced.matches ||
            !old ||
            ms <= 0 ||
            elapsed >= ms
          ) {
            bar.appendChild(nl);
            if (old) old.remove();
            syncLabels();
            return;
          }
          // 负的 delay = 动画一开始就已经走了 elapsed 毫秒；再补半帧，因为动画要等下一帧才真正开始
          var opts = {
            duration: ms,
            delay: elapsed > 0 ? -(elapsed + 8) : 0,
            easing: p.ease || 'ease',
            fill: 'forwards',
          };
          var anim;
          if (p.kind === 'circle') {
            // 页面区紧贴在标题条下方，页面里的 y 换到标题条坐标要加上条高，圆就能连成一个
            var at = ' at ' + p.x + 'px ' + (p.y + bar.offsetHeight) + 'px)';
            var small = 'circle(0px' + at;
            var big = 'circle(' + p.r + 'px' + at;
            if (p.dark) {
              // 切到深色：旧画面向按钮收缩，新画面垫在下面露出来（与站点一致）
              bar.insertBefore(nl, old);
              anim = old.animate(
                [{ clipPath: big }, { clipPath: small }],
                opts
              );
            } else {
              // 切到浅色：新画面从按钮处扩散，盖住旧画面
              bar.appendChild(nl);
              anim = nl.animate([{ clipPath: small }, { clipPath: big }], opts);
            }
          } else {
            bar.appendChild(nl);
            anim = nl.animate([{ opacity: 0 }, { opacity: 1 }], opts);
          }
          syncLabels();
          anim.onfinish = settle;
        };

        // 最大化图标与读屏文案
        function syncLabels() {
          var max = bar.dataset.max === 'true';
          var label = max ? '向下还原' : '最大化';
          Array.prototype.forEach.call(
            bar.querySelectorAll('[data-act="toggle-maximize"]'),
            function (b) {
              b.setAttribute('aria-label', label);
              b.setAttribute('title', label);
            }
          );
        }
        function setMax(v) {
          bar.dataset.max = v ? 'true' : 'false';
          syncLabels();
        }

        function act(name) {
          invoke('tm_window', { action: name }).then(function (m) {
            if (typeof m === 'boolean') setMax(m);
          });
        }

        // 按钮点击；空白处按下 = 拖动窗口，双击 = 最大化 / 还原
        bar.addEventListener('click', function (e) {
          var b = e.target.closest && e.target.closest('.ctl');
          if (b) act(b.getAttribute('data-act'));
        });
        bar.addEventListener('mousedown', function (e) {
          if (e.button !== 0) return;
          if (e.target.closest && e.target.closest('.ctl')) return;
          act(e.detail >= 2 ? 'toggle-maximize' : 'drag');
        });
        bar.addEventListener('contextmenu', function (e) {
          e.preventDefault();
        });

        // 窗口大小变了（含贴边、双击、快捷键最大化）：重新问一次是否最大化
        var timer = 0;
        window.addEventListener('resize', function () {
          clearTimeout(timer);
          timer = setTimeout(function () {
            act('state');
          }, 80);
        });

        curLayer = makeLayer(cur);
        bar.appendChild(curLayer);
        syncLabels();
        act('state');
        // 页面区可能比这里先报了主题色，来补一次
        invoke('tm_hello');
      })();
    </script>
  </body>
</html>
